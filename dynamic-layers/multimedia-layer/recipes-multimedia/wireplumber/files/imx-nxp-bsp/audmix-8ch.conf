monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound-amix.pro-output-.*" }
    ]
    actions = {
      update-props = {
        audio.channels = 8
        audio.position = [ FL FR FC LFE RL RR SL SR ]
        channelmix.disable = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.platform-sound-amix.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2100
      }
    }
  }
]

