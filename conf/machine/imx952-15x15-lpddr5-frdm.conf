#@TYPE: Machine
#@NAME: NXP i.MX 952 15x15 FRDM with LPDDR5
#@SOC: i.MX952
#@DESCRIPTION: Machine configuration for NXP i.MX 952 FRDM with LPDDR5
#@MAINTAINER: Flora Hu <flora.hu@nxp.com>

require conf/machine/include/imx952-evk.inc

KERNEL_DEVICETREE_BASENAME = "imx952-frdm"

MACHINE_FEATURES:append:use-nxp-bsp = " nxpiw612-sdio"

KERNEL_DEVICETREE:append:use-nxp-bsp = " \
    freescale/imx952-jailhouse-inmate.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-ap1302-csi0-2lanes.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-ap1302-csi1-2lanes.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-aud-hat.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-aud-hat.dtbo \
    freescale/${KERNEL_DEVICETREE_BASENAME}-boe-wxga-lvds-panel.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-boe-wxga-lvds-panel.dtbo \
    freescale/${KERNEL_DEVICETREE_BASENAME}-dual-ap1302.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-os08a20-csi0-2lanes.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-os08a20-csi0-2lanes.dtbo \
    freescale/${KERNEL_DEVICETREE_BASENAME}-os08a20-csi1-2lanes.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-os08a20-csi1-2lanes.dtbo \
    freescale/${KERNEL_DEVICETREE_BASENAME}-os08a20-dual.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-pcie-ep.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-root.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-v2x-she0.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-waveshare-7inch-c-panel.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-waveshare-7inch-c-panel.dtbo \
"

UBOOT_CONFIG_BASENAME = "imx952_frdm"

IMXBOOT_TARGETS_BASENAME = "flash"

OEI_BOARD  = "mx952lp5-15-frdm"
DDR_TYPE   = "lpddr5"
OEI_DDR_CONFIG  = "MIMX952_LPDDR5_FRDM_15X15_4266MTS_FW2024.09-SP2_timing"
OEI_DDR_CONFIG_ECC = "MIMX952_LPDDR5_FRDM_15X15_4266MTS_FW2024.09-SP2_ECC_enabled_timing"

# Multiple system manager configs by IMXBOOT_VARIANT
SYSTEM_MANAGER_CONFIG = \
    "${@bb.utils.contains('IMXBOOT_VARIANT', 'alt',       'mx952alt', \
        bb.utils.contains('IMXBOOT_VARIANT', 'jailhouse', 'mx952evkjailhouse', \
        bb.utils.contains('IMXBOOT_VARIANT', 'netc',      'mx952evknetc', \
        bb.utils.contains('IMXBOOT_VARIANT', 'rpmsg',     'mx952frdmrpmsg', \
                                                          'mx952evk', d), d), d), d)}"

M4_DEFAULT_IMAGE_MX952 = "imx952-15x15-frdm_m7_TCM_power_mode_switch.bin"

DDR_FIRMWARE_NAME = " \
    lpddr5_dmem_v202409.bin \
    lpddr5_dmem_qb_v202409.bin \
    lpddr5_imem_v202409.bin \
    lpddr5_imem_qb_v202409.bin \
"

IMAGE_BOOT_FILES:append = " \
    mcore-demos/imx952-15x15-frdm_m7_TCM_hello_world.bin \
    mcore-demos/imx952-15x15-frdm_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx952-15x15-frdm_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx952-15x15-frdm_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
"
