#@TYPE: Machine
#@NAME: NXP i.MX 93W 14x12 FRDM with LPDDR4X
#@SOC: i.MX93W
#@DESCRIPTION: Machine configuration for NXP i.MX 93W 14x12 FRDM with LPDDR4X
#@MAINTAINER: Jun Zhu <junzhu@nxp.com>

MACHINEOVERRIDES =. "mx93w:"

require conf/machine/include/imx93-evk.inc

MACHINE_FEATURES:append:use-nxp-bsp = " nxpiw610-sdio"

KERNEL_DEVICETREE_BASENAME = "imx93w-frdm"

KERNEL_DEVICETREE:append:use-nxp-bsp = " \
    freescale/${KERNEL_DEVICETREE_BASENAME}-8mic-reve.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-waveshare-7inch-c-panel.dtb \
"

UBOOT_CONFIG_BASENAME = "imx93w_frdm"

DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

WKS_FILE_DEPENDS:append:imx-nxp-bsp = " imx-m33-demos"

IMAGE_BOOT_FILES:append:imx-nxp-bsp = " \
    mcore-demos/imx93w-14x12-evk_m33_TCM_power_mode_switch.bin \
    mcore-demos/imx93w-14x12-evk_m33_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx93w-14x12-evk_m33_TCM_rpmsg_lite_str_echo_rtos.bin \
    mcore-demos/imx93w-14x12-evk_m33_TCM_sai_low_power_audio.bin \
"

IMXBOOT_TARGETS = "flash_singleboot"
