#@TYPE: Machine
#@NAME: NXP i.MX 95 15x15 FRDM with LPDDR5
#@SOC: i.MX95
#@DESCRIPTION: Machine configuration for NXP i.MX 95 15x15 FRDM with LPDDR5
#@MAINTAINER: Jun Zhu <junzhu@nxp.com>

MACHINEOVERRIDES =. "mx95:"

require conf/machine/include/imx95-evk.inc

MACHINE_FEATURES:append:use-nxp-bsp = " nxpiw612-sdio"

KERNEL_DEVICETREE_BASENAME = "imx95-15x15-frdm"

KERNEL_DEVICETREE:append:use-nxp-bsp = " \
    freescale/${KERNEL_DEVICETREE_BASENAME}.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-8mic-reve.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-ap1302.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-aud-hat.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-boe-wxga-lvds-panel.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-dual-os08a20-isp.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-neutron.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-os08a20-combo-isp.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-os08a20-isp.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-root.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-rpmsg.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-waveshare-7inch-c-panel.dtb \
"

UBOOT_CONFIG_BASENAME = "imx95_15x15_frdm"

IMXBOOT_TARGETS_BASENAME = "flash"

OEI_BOARD  = "mx95lp5-15-frdm"
DDR_TYPE   = "lpddr5"
DDR_FIRMWARE_NAME = " \
    lpddr5_dmem_v202409.bin \
    lpddr5_dmem_qb_v202409.bin \
    lpddr5_imem_v202409.bin \
    lpddr5_imem_qb_v202409.bin \
"
OEI_DDR_CONFIG     = "MIMX95_LPDDR5_FRDM_15X15_4266MTS_FW2024.09_timing"
OEI_DDR_CONFIG_ECC = "MIMX95_LPDDR5_FRDM_15X15_4266MTS_FW2024.09_ECC_enabled_timing"

IMXBOOT_VARIANTS = "alt jailhouse rpmsg"
# Multiple system manager configs by IMXBOOT_VARIANT
SYSTEM_MANAGER_CONFIG = "${@bb.utils.contains('IMXBOOT_VARIANT', 'alt',       'mx95alt', \
                            bb.utils.contains('IMXBOOT_VARIANT', 'jailhouse', 'mx95frdmjailhouse', \
                            bb.utils.contains('IMXBOOT_VARIANT', 'rpmsg',     'mx95frdmrpmsg', \
                                                                              'mx95frdm', d), d), d)}"

M4_DEFAULT_IMAGE = "imx95-15x15-frdm_m7_TCM_power_mode_switch.bin"

IMAGE_BOOT_FILES:append = " \
    mcore-demos/imx95-15x15-frdm_m7_TCM_hello_world.bin \
    mcore-demos/imx95-15x15-frdm_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx95-15x15-frdm_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx95-15x15-frdm_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
"
