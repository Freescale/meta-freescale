#@TYPE: Machine
#@NAME: NXP i.MX 937 15x15 FRDM with LPDDR5
#@SOC: i.MX937
#@DESCRIPTION: Machine configuration for NXP i.MX 937 15x15 FRDM with LPDDR5
#@MAINTAINER: Jun Zhu <junzhu@nxp.com>

require conf/machine/include/imx937-evk.inc

KERNEL_DEVICETREE_BASENAME = "imx937-frdm"

KERNEL_DEVICETREE:append:use-nxp-bsp = " \
    freescale/imx937-jailhouse-inmate.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-ap1302-csi0-2lanes.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-ap1302-csi0-2lanes.dtbo \
    freescale/${KERNEL_DEVICETREE_BASENAME}-ap1302-csi1-2lanes.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-ap1302-csi1-2lanes.dtbo \
    freescale/${KERNEL_DEVICETREE_BASENAME}-aud-hat.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-boe-wxga-lvds-panel.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-dual-ap1302.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-pcie-ep.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-sgmii.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-root.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-v2x-she0.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-waveshare-7inch-c-panel.dtb \
"

UBOOT_CONFIG_BASENAME = "imx937_frdm"

IMXBOOT_TARGETS_BASENAME = "flash"

OEI_BOARD  = "mx937lp5-15-frdm"
DDR_TYPE   = "lpddr5"
DDR_FIRMWARE_NAME = " \
    lpddr5_dmem_v202409.bin \
    lpddr5_dmem_qb_v202409.bin \
    lpddr5_imem_v202409.bin \
    lpddr5_imem_qb_v202409.bin \
"
OEI_DDR_CONFIG     = "MIMX937_LPDDR5_FRDM_15X15_3733MTS_FW2024.09-SP2_timing"
OEI_DDR_CONFIG_ECC = "MIMX937_LPDDR5_FRDM_15X15_3733MTS_FW2024.09-SP2_ECC_enabled_timing"
SYSTEM_MANAGER_CONFIG_DEFAULT = "mx937frdm"

M4_DEFAULT_IMAGE = "imx937-15x15-frdm_m7_TCM_power_mode_switch.bin"
