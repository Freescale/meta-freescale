name: OE Lint - HOMEPAGE reachability

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepageping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: contrib/oelint/requirements.txt
      - run: pip install -r contrib/oelint/requirements.txt
      - run: |
          findings=$(./contrib/oelint/run-oelint.sh --mode all --quiet --relpaths \
              --exit-zero --output /dev/stdout \
              --messageformat '{path}:{line}: {id}: {msg}' \
              | grep 'oelint.vars.homepageping' || true)
          {
            echo "## Unreachable HOMEPAGE values"
            echo
            if [ -n "$findings" ]; then
              echo 'Verify each by hand before acting: this rule shares an egress IP'
              echo 'with every other runner and reports rate-limited hosts as dead.'
              echo
              echo '```'
              echo "$findings"
              echo '```'
            else
              echo 'All HOMEPAGE values reachable.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
